# Pre-commit configuration for xiVIEW main repository
repos:
  # Standard pre-commit hooks for general file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: 'vendor/'
      - id: end-of-file-fixer
        exclude: 'vendor/'
      - id: check-yaml
      - id: check-json
        exclude: 'vendor/'
      - id: check-added-large-files
        args: [ '--maxkb=1000' ]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [ '--fix=lf' ]
        exclude: 'vendor/'

  # NPM lint check
  - repo: local
    hooks:
      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: '\.(js|jsx)$'
        exclude: '(vendor/|node_modules/)'

  # CSS lint check
  - repo: local
    hooks:
      - id: stylelint
        name: stylelint CSS
        entry: npm run lint:css
        language: system
        pass_filenames: false
        files: '\.css$'
        exclude: '(vendor/|node_modules/)'

  # Custom webpack build validation
  - repo: local
    hooks:
      - id: webpack-build-check
        name: webpack build validation
        entry: npm run build-dev
        language: system
        pass_filenames: false
        files: '\.(js|css|json)$'
        exclude: '(vendor/|node_modules/|dist/)'
        stages: [push]

  # Run automated tests
  - repo: local
    hooks:
      - id: npm-test
        name: run npm tests
        entry: npm run test
        language: system
        pass_filenames: false
        files: '\.(js|css)$'
        exclude: '(vendor/|node_modules/|dist/)'
        stages: [push]


# Global configuration
default_stages: [ commit ]
fail_fast: false
